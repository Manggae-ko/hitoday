# Push a tag like v0.1.0 (matching "version" in package.json) → creates the GitHub Release,
# then builds the macOS .dmg and Windows .exe and uploads them to it. The download page's
# buttons point at releases/latest, so they pick up the new installers right away.
#
# The relay address is baked into the installers from the repo variable
# Settings → Secrets and variables → Actions → Variables → JAKDANG_SERVER (e.g. wss://jakdang.naegoworks.com)
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm test

  # One release up front, so the two builds below don't race to create it.
  create-release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $version" && exit 1
          fi
      - name: Create the release
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "작당모의 $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bake the relay address into the app
        if: ${{ vars.JAKDANG_SERVER != '' }}
        shell: bash
        run: npm pkg set "jakdang.server=${{ vars.JAKDANG_SERVER }}"
      - name: Build and upload installers
        run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
