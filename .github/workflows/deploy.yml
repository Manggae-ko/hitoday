# Push to main (server, shared, web or deploy changes) → tests → the server pulls and rebuilds.
#
# One-time setup: repo Settings → Secrets and variables → Actions → Secrets:
#   DEPLOY_HOST     server public IP (or jakdang.naegoworks.com)
#   DEPLOY_USER     ssh user (e.g. root)
#   DEPLOY_SSH_KEY  private key whose public key is in the server's ~/.ssh/authorized_keys
# The repo must already be cloned on the server at ~/jakdang (see docs/DEPLOY_NCLOUD.md).
name: deploy

on:
  push:
    branches: [main, dev]
    paths:
      - "server/**"
      - "shared/**"
      - "web/**"
      - "deploy/**"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Pull and rebuild on the server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/jakdang
            git pull --ff-only
            cd deploy
            docker compose up -d --build
            docker image prune -f
      - name: Check the server answers
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://${{ vars.JAKDANG_DOMAIN || 'jakdang.naegoworks.com' }}/health"; then exit 0; fi
            sleep 3
          done
          echo "health check failed" && exit 1
