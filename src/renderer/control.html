<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'" />
    <title>놀러와</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="control.css" />
  </head>
  <body>
    <header class="masthead">
      <h1>놀러와</h1>
      <p class="status" id="status" data-connected="false">연결 중…</p>
    </header>

    <main>
      <section class="card card-chat" aria-labelledby="chat-heading">
        <h2 id="chat-heading" class="eyebrow">친구랑 얘기하기</h2>
        <ol class="chat-log" id="chat-log" aria-live="polite">
          <li class="chat-empty">아직 나눈 얘기가 없어요. 먼저 말 걸어 보세요!</li>
        </ol>
        <form id="send-form" class="send-row">
          <label class="sr-only" for="message">할 말</label>
          <input id="message" maxlength="80" autocomplete="off" placeholder="뭐해? 밥 먹었어?" />
          <button type="submit" class="go" id="go" aria-label="보내기">→</button>
        </form>
        <p class="counter" id="counter">0 / 80 · Enter로 보내기</p>
      </section>

      <section class="card card-me" aria-labelledby="me-heading">
        <h2 id="me-heading" class="eyebrow">내 코드</h2>
        <div class="code-row">
          <output id="my-code" class="code">······</output>
          <button type="button" id="copy" class="chip">복사</button>
        </div>
        <p class="hint">친구한테 이 코드를 알려주세요.</p>
      </section>

      <form id="settings-form" class="settings" aria-labelledby="settings-heading">
        <h2 id="settings-heading" class="eyebrow">설정</h2>
        <div class="settings-grid">
          <label>내 이름 <input id="name" maxlength="12" autocomplete="off" /></label>
          <label>친구 코드 <input id="friend" maxlength="6" autocomplete="off" placeholder="ABC234" /></label>
        </div>
        <details>
          <summary>고급: 서버 주소</summary>
          <input id="server" autocomplete="off" spellcheck="false" />
        </details>
        <button type="submit" class="save">저장</button>
      </form>

      <p class="notice" id="notice" role="status" aria-live="polite"></p>
    </main>

    <script src="control.js"></script>
  </body>
</html>
