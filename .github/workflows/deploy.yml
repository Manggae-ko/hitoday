# Push to main/dev (server, shared, web or deploy changes) → run the tests, then wait
# until the server reports the new commit at /version.
#
# Deploys are pull-based: the server checks GitHub every 2 minutes and updates itself
# (deploy/auto-update.sh, installed once with deploy/install-auto-update.sh). Nothing
# needs to reach into the server, so SSH can stay open to your own IP only.
name: deploy

on:
  push:
    branches: [main, dev]
    paths:
      - "server/**"
      - "shared/**"
      - "web/**"
      - "deploy/**"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm test

  verify:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the server to pick up this commit
        env:
          DOMAIN: ${{ vars.JAKDANG_DOMAIN || 'jakdang.naegoworks.com' }}
        run: |
          want="${GITHUB_SHA::7}"
          for i in $(seq 1 60); do
            got="$(curl -fsS "https://$DOMAIN/version" || true)"
            if [ "$got" = "$want" ]; then
              echo "server is running $want"
              curl -fsS "https://$DOMAIN/health"
              exit 0
            fi
            echo "server has '$got', waiting for $want..."
            sleep 15
          done
          echo "server did not update within 15 minutes (check /var/log/jakdang-update.log on the server)"
          exit 1
