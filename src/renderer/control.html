<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
    <title>놀러와</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="control.css" />
  </head>
  <body>
    <header class="masthead">
      <h1>놀러와</h1>
      <p class="status" id="status" data-connected="false">연결 중…</p>
    </header>

    <main>
      <!-- Not in a room yet -->
      <section class="card card-lobby" id="lobby" aria-labelledby="lobby-heading">
        <h2 id="lobby-heading" class="eyebrow">방에 들어가기</h2>
        <p class="lobby-lede">방 하나에 친구들을 초대하면, 다 같이 서로의 바탕화면 아래에 나타나요.</p>
        <button type="button" class="go wide" id="create">새 방 만들기</button>
        <p class="or">또는 초대 코드로</p>
        <form id="join-form" class="send-row">
          <label class="sr-only" for="invite">초대 코드</label>
          <input id="invite" maxlength="7" autocomplete="off" spellcheck="false" placeholder="초대 코드 6자리" />
          <button type="submit" class="chip-btn" id="join">들어가기</button>
        </form>
      </section>

      <!-- In a room -->
      <section class="card card-room" id="room" aria-labelledby="room-heading" hidden>
        <div class="room-head">
          <div>
            <h2 id="room-heading" class="eyebrow">초대 코드</h2>
            <output id="room-code" class="code">······</output>
          </div>
          <button type="button" id="copy" class="chip">복사</button>
        </div>
        <ul class="members" id="members" aria-label="방 멤버"></ul>

        <div class="games" role="group" aria-label="미니게임">
          <button type="button" class="game-btn" data-game="lottery">☕ 커피 뽑기</button>
          <button type="button" class="game-btn" data-game="rps">✊ 가위바위보</button>
          <button type="button" class="game-btn" data-game="reaction">⚡ 반응속도</button>
        </div>

        <ol class="chat-log" id="chat-log" aria-live="polite"></ol>
        <form id="send-form" class="send-row">
          <label class="sr-only" for="message">할 말</label>
          <input id="message" maxlength="80" autocomplete="off" placeholder="다들 뭐해?" />
          <button type="submit" class="go" id="go" aria-label="보내기">→</button>
        </form>
        <div class="room-foot">
          <span class="counter" id="counter">0 / 80 · Enter로 보내기</span>
          <button type="button" class="link" id="leave">방 나가기</button>
        </div>
      </section>

      <form id="settings-form" class="settings" aria-labelledby="settings-heading">
        <h2 id="settings-heading" class="eyebrow">내 캐릭터</h2>
        <div class="look-row">
          <div class="preview" id="preview"><img id="preview-img" alt="내 캐릭터 미리보기" /></div>
          <div class="look-actions">
            <label class="chip-btn file-btn">
              이미지 올리기
              <input type="file" id="avatar-file" accept="image/png" />
            </label>
            <button type="button" class="link" id="avatar-reset" hidden>기본 캐릭터로</button>
            <p class="hint">PNG · 32×32 한 장 또는 128×128 시트 · 32KB 이하</p>
          </div>
        </div>
        <div class="send-row">
          <label class="sr-only" for="name">내 이름</label>
          <input id="name" maxlength="12" autocomplete="off" />
          <button type="submit" class="chip-btn">이름 저장</button>
        </div>
        <details id="server-box" hidden>
          <summary>개발용: 서버 주소</summary>
          <input id="server" autocomplete="off" spellcheck="false" />
        </details>
      </form>

      <p class="notice" id="notice" role="status" aria-live="polite"></p>
    </main>

    <script src="control.js"></script>
  </body>
</html>
